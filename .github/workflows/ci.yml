name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Send success notification
        if: success()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"CI Pipeline SUCCESS: Build completed successfully."}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Send failure notification
        if: failure()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"CI Pipeline FAILED: Build failed. Check GitHub Actions logs."}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"